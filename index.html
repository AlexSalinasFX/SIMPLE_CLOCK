<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reloj analógico</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#292928;--muted:#696966;--surface:#f7f7f5;--border:#d7d7d3;--hover:#eaeae7}
:root[data-theme=dark]{--bg:#191919;--fg:#f5f5f4;--muted:#b7b7b4;--surface:#242424;--border:#555;--hover:#3a3a3a}
:root[data-theme=light]{--bg:#fff;--fg:#292928;--muted:#696966;--surface:#f7f7f5;--border:#d7d7d3;--hover:#eaeae7}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#191919;--fg:#f5f5f4;--muted:#b7b7b4;--surface:#242424;--border:#555;--hover:#3a3a3a}}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:220px}body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.widget{position:relative;width:100%;height:100%;min-height:220px;display:grid;place-items:center;overflow:hidden}.clock{display:block;height:min(80%,300px);width:min(80%,300px);overflow:visible;color:var(--clock-color,var(--fg))}.tick{stroke:currentColor;stroke-width:2.4;stroke-linecap:square}.hand{stroke:currentColor;stroke-linecap:round}.hour{stroke-width:4}.minute{stroke-width:2.5}.second{stroke-width:1.2}.pin{fill:currentColor}.digital,.zone{fill:currentColor;text-anchor:middle;font-family:Georgia,'Times New Roman',serif}.digital{font-size:19px;letter-spacing:2px}.zone{font-size:13px;letter-spacing:.2px}.settings-button{position:absolute;right:10px;bottom:10px;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--fg);cursor:pointer;opacity:0;transition:opacity .15s}.widget:hover .settings-button,.settings-button:focus-visible,.widget:focus-within .settings-button,.settings-button[aria-expanded=true]{opacity:1}@media(hover:none){.settings-button{opacity:1}}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #2783de;outline-offset:2px}.settings-button:hover{background:var(--hover)}.panel{position:absolute;inset:8px;max-width:390px;margin:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:0 3px 15px #0003;padding:12px 16px;overflow:auto}.panel[hidden]{display:none}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.panel h2{font-size:15px;line-height:1.25;margin:0}.close{display:grid;place-items:center;width:36px;height:36px;margin:-5px -6px -5px 0;border:0;border-radius:6px;background:transparent;color:var(--fg);font-size:23px;cursor:pointer}.close:hover{background:var(--hover)}.row{display:flex;min-height:38px;align-items:center;justify-content:space-between;gap:12px;font-size:14px}.row+.row{border-top:1px solid var(--border)}select{max-width:60%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 7px}.checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:10px;border-top:1px solid var(--border);font-size:14px}.checks label{display:flex;align-items:center;gap:6px;min-height:28px}.checks input{width:16px;height:16px;accent-color:#2783de;margin:0}.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
@media(max-height:280px){.panel{padding:8px 12px}.row{min-height:33px}.checks{padding-top:5px}.hint{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Ajustes inspirados en iOS */
:root{--ios-bg:#f2f2f7;--ios-card:#fff;--ios-separator:rgba(60,60,67,.18);--ios-text:#111113;--ios-secondary:#626267;--ios-button:#e5e5ea;--ios-switch:#34c759}
:root[data-theme=dark]{--ios-bg:#1c1c1e;--ios-card:#2c2c2e;--ios-separator:rgba(235,235,245,.16);--ios-text:#fff;--ios-secondary:#aeaeb2;--ios-button:#3a3a3c;--ios-switch:#30d158}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--ios-bg:#1c1c1e;--ios-card:#2c2c2e;--ios-separator:rgba(235,235,245,.16);--ios-text:#fff;--ios-secondary:#aeaeb2;--ios-button:#3a3a3c;--ios-switch:#30d158}}
.panel{inset:6px;max-width:340px;padding:14px 12px 18px;border:1px solid var(--ios-separator);border-radius:16px;background:var(--ios-bg);color:var(--ios-text);box-shadow:0 8px 30px #0004;overscroll-behavior:contain;scrollbar-width:thin}
.panel-header{position:relative;display:flex;justify-content:center;align-items:center;min-height:35px;margin:0 0 12px}.panel h2{font-size:16px;font-weight:650;letter-spacing:-.25px}.close{position:absolute;right:0;top:0;width:32px;height:32px;margin:0;border-radius:50%;background:var(--ios-button);color:var(--ios-secondary);font-size:22px;line-height:1}.close:hover{background:var(--ios-button);filter:brightness(.94)}
.ios-group{background:var(--ios-card);border-radius:11px;overflow:hidden;margin-bottom:10px}.row,.checks label{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:43px;padding:0 12px;font-size:14px;letter-spacing:-.15px}.row+.row{border:0}.row+.row:before,.checks label+label:before{content:"";position:absolute;top:0;left:12px;right:0;height:1px;background:var(--ios-separator)}
select{max-width:65%;border:0;background:transparent;color:var(--ios-secondary);padding:6px 0;font-size:14px;text-align:right;cursor:pointer;outline-offset:0}.checks{display:block;padding:0;border:0;font-size:14px}.checks label{min-height:43px}.checks input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:44px;height:27px;border:0;border-radius:20px;margin:0;background:#8e8e93;cursor:pointer;transition:background .2s}.checks input:before{content:"";position:absolute;left:2px;top:2px;width:23px;height:23px;border-radius:50%;background:white;box-shadow:0 1px 3px #0004;transition:transform .2s}.checks input:checked{background:var(--ios-switch)}.checks input:checked:before{transform:translateX(17px)}.checks input:focus-visible{outline:2px solid #2783de;outline-offset:3px}.hint{font-size:12px;line-height:1.4;color:var(--ios-secondary);margin:4px 12px}
@media(max-width:240px){.panel{padding:10px 7px}.row,.checks label{padding:0 8px;font-size:13px}select{font-size:12px;max-width:58%}.panel h2{font-size:14px}}

/* Cristal translúcido: materiales suaves y reflejos discretos. */
:root{--glass:rgba(244,246,250,.72);--glass-card:rgba(255,255,255,.46);--glass-border:rgba(255,255,255,.82);--glass-sep:rgba(46,51,62,.12);--glass-text:#17181b;--glass-muted:#525660;--glass-close:rgba(78,84,98,.12);--glass-shadow:rgba(24,30,42,.14)}
:root[data-theme=dark]{--glass:rgba(39,41,46,.72);--glass-card:rgba(255,255,255,.09);--glass-border:rgba(255,255,255,.22);--glass-sep:rgba(255,255,255,.13);--glass-text:#fafafa;--glass-muted:#d0d0d5;--glass-close:rgba(255,255,255,.13);--glass-shadow:rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--glass:rgba(39,41,46,.72);--glass-card:rgba(255,255,255,.09);--glass-border:rgba(255,255,255,.22);--glass-sep:rgba(255,255,255,.13);--glass-text:#fafafa;--glass-muted:#d0d0d5;--glass-close:rgba(255,255,255,.13);--glass-shadow:rgba(0,0,0,.35)}}
.panel{border:1px solid var(--glass-border);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.09),transparent 52%),var(--glass);color:var(--glass-text);-webkit-backdrop-filter:blur(22px) saturate(155%);backdrop-filter:blur(22px) saturate(155%);box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 12px 32px var(--glass-shadow);padding:14px 12px 18px}
.panel-header{position:sticky;top:-14px;z-index:2;margin:-14px -12px 10px;padding:14px 12px 6px;min-height:51px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:21px 21px 0 0}.panel h2{font-size:16px;font-weight:650}.close{right:12px;top:12px;background:var(--glass-close);color:var(--glass-text);border:1px solid var(--glass-border);box-shadow:inset 0 1px 1px rgba(255,255,255,.15)}.close:hover{background:var(--glass-close);filter:brightness(1.15)}
.ios-group{background:var(--glass-card);border:1px solid var(--glass-border);border-radius:15px;box-shadow:inset 0 1px rgba(255,255,255,.08);overflow:hidden}.row+.row:before,.checks label+label:before{background:var(--glass-sep)}select{color:var(--glass-muted)}.hint{color:var(--glass-muted)}
.checks input{background:rgba(120,120,128,.58);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}.checks input:checked{background:#30c767}.checks input:before{box-shadow:0 1px 4px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.8)}
@media(max-width:240px){.panel{padding:10px 7px 14px}.panel-header{top:-10px;margin:-10px -7px 8px;padding:10px 7px 6px}.close{right:7px;top:8px}}

/* Controles integrados, sin desplegables ni desplazamiento */
.panel{display:flex;flex-direction:column;overflow:hidden;padding:12px 14px 13px;max-width:350px}.panel[hidden]{display:none}
.panel-header{position:relative;top:auto;min-height:28px;margin:0 0 8px;padding:0;background:none;backdrop-filter:none}.close{top:-2px;right:0;width:30px;height:30px}
.tabs,.segment{display:flex;gap:2px;padding:3px;background:var(--glass-card);border:1px solid var(--glass-border);border-radius:12px}.tabs{margin-bottom:10px}.tabs button,.segment button{border:0;min-width:0;min-height:30px;flex:1;border-radius:9px;font:500 13px system-ui,sans-serif;letter-spacing:-.1px;background:transparent;color:var(--glass-muted);cursor:pointer}.tabs button[aria-selected=true],.segment button[aria-pressed=true]{color:var(--glass-text);background:var(--glass-card);box-shadow:0 1px 4px #0002,inset 0 0 0 1px var(--glass-border)}.tabs button:hover,.segment button:hover{color:var(--glass-text)}
.screen{min-height:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}.screen[hidden]{display:none}.screen-title{font-size:12px;font-weight:600;color:var(--glass-muted);margin:0 0 6px 3px}.swatches{display:flex;gap:11px;align-items:center;padding:3px 5px}.swatch{position:relative;border:2px solid var(--glass-border);width:32px;height:32px;flex:0 0 32px;border-radius:50%;padding:0;cursor:pointer;background:var(--swatch);box-shadow:0 2px 6px #0002}.swatch[aria-pressed=true]:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--glass-text)}.swatch.default{--swatch:linear-gradient(135deg,#f4f4f4 0 49%,#38383b 51% 100%)}.swatch.blue{--swatch:#8da5b5}.swatch.purple{--swatch:#bea585}.swatch.green{--swatch:#97ad9b}.swatch:focus-visible,.segment button:focus-visible,.tabs button:focus-visible{outline:2px solid #2783de;outline-offset:2px}
.checks{border-radius:12px;margin:0}.checks label{min-height:31px;padding:0 10px;font-size:13px}.checks label+label:before{left:10px}.checks input{width:38px;height:23px}.checks input:before{width:19px;height:19px}.checks input:checked:before{transform:translateX(15px)}
@media(max-height:260px){.panel{padding:8px 10px}.panel-header{margin-bottom:4px;min-height:26px}.close{height:26px;width:26px}.tabs{margin-bottom:5px}.tabs button,.segment button{min-height:26px}.screen{gap:5px}.screen-title{margin-bottom:3px}.checks label{min-height:28px}.swatch{width:27px;height:27px;flex-basis:27px}.swatches{padding:2px 5px}}
@media(max-width:250px){.panel{padding-left:8px;padding-right:8px}.segment button,.tabs button{font-size:11px}.panel h2{font-size:14px}.screen{gap:6px}.swatches{gap:10px}}

@media(max-height:260px){.panel{padding-top:6px;padding-bottom:6px}.panel-header{min-height:24px;margin-bottom:3px}.close{height:24px;width:24px}.tabs{margin-bottom:4px}.tabs button,.segment button{min-height:22px}.screen{gap:4px}.screen-title{font-size:11px;line-height:13px;margin-bottom:2px}.checks label{min-height:24px;font-size:12px}.checks input{width:34px;height:20px}.checks input:before{width:16px;height:16px}.checks input:checked:before{transform:translateX(14px)}}
</style>
</head>
<body><main class="widget" aria-label="Reloj analógico y digital">
<svg class="clock" viewBox="0 0 240 240" role="img" aria-label="Reloj analógico"><g id="ticks"></g><g id="hands"><line class="hand hour" id="hour" x1="120" y1="120" x2="120" y2="52"/><line class="hand minute" id="minute" x1="120" y1="120" x2="120" y2="25"/><line class="hand second" id="second" x1="120" y1="139" x2="120" y2="16"/><circle class="pin" cx="120" cy="120" r="4"/></g><text class="digital" id="digital" x="120" y="155">--:--</text><text class="zone" id="zone" x="120" y="177"></text></svg>
<button class="settings-button" id="open" type="button" aria-label="Abrir ajustes" aria-expanded="false" aria-controls="panel"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.4 13.4a7.9 7.9 0 0 0 0-2.8l2-1.5-2-3.4-2.4.9a7.8 7.8 0 0 0-2.4-1.4L14.2 2H9.8l-.4 3.2A7.8 7.8 0 0 0 7 6.6l-2.4-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 2.8l-2 1.5 2 3.4 2.4-.9a7.8 7.8 0 0 0 2.4 1.4l.4 3.2h4.4l.4-3.2a7.8 7.8 0 0 0 2.4-1.4l2.4.9 2-3.4-2-1.5Z"/></svg></button>
<section class="panel" id="panel" aria-labelledby="settings-title" hidden>
<div class="panel-header"><h2 id="settings-title">Ajustes</h2><button class="close" id="close" type="button" aria-label="Cerrar ajustes">×</button></div>
<div class="tabs" role="tablist" aria-label="Secciones de ajustes"><button id="tab-visual" role="tab" aria-selected="true" aria-controls="visual" type="button">Aspecto</button><button id="tab-clock" role="tab" aria-selected="false" aria-controls="clock-settings" type="button">Reloj</button></div>
<div class="screen" id="visual" role="tabpanel" aria-labelledby="tab-visual"><div><p class="screen-title">Tema</p><div class="segment" role="group" aria-label="Tema"><button type="button" data-key="theme" data-value="auto">Auto</button><button type="button" data-key="theme" data-value="light">Claro</button><button type="button" data-key="theme" data-value="dark">Oscuro</button></div></div><div><p class="screen-title">Color</p><div class="swatches" role="group" aria-label="Color"><button type="button" class="swatch default" data-key="accent" data-value="default" aria-label="Predeterminado" title="Predeterminado"></button><button type="button" class="swatch blue" data-key="accent" data-value="blue" aria-label="Azul niebla" title="Azul niebla"></button><button type="button" class="swatch purple" data-key="accent" data-value="purple" aria-label="Arena" title="Arena"></button><button type="button" class="swatch green" data-key="accent" data-value="green" aria-label="Verde salvia" title="Verde salvia"></button></div></div></div>
<div class="screen" id="clock-settings" role="tabpanel" aria-labelledby="tab-clock" hidden><div><p class="screen-title">Zona horaria</p><div class="segment" role="group" aria-label="Zona horaria"><button type="button" data-key="timezone" data-value="Europe/Berlin">Madrid</button><button type="button" data-key="timezone" data-value="local">Local</button><button type="button" data-key="timezone" data-value="UTC">UTC</button></div></div><div class="ios-group checks"><label><span>Segundero</span><input id="seconds" type="checkbox" role="switch"></label><label><span>Hora digital</span><input id="showDigital" type="checkbox" role="switch"></label><label><span>Zona horaria</span><input id="showZone" type="checkbox" role="switch"></label></div></div>
</section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const defaults={theme:'auto',timezone:'Europe/Berlin',accent:'default',seconds:true,showDigital:true,showZone:true};let saved={};try{saved=JSON.parse(localStorage.getItem('reloj-ajustes-v1')||'{}')}catch{}const state={...defaults,...saved};const allowed={theme:['auto','dark','light'],timezone:['Europe/Berlin','local','UTC'],accent:['default','blue','purple','green']};for(const k in allowed)if(!allowed[k].includes(state[k]))state[k]=defaults[k];for(const k of ['seconds','showDigital','showZone'])if(typeof state[k]!=='boolean')state[k]=defaults[k];const ticks=$('ticks');for(let i=0;i<12;i++){let e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1','120');e.setAttribute('x2','120');e.setAttribute('y1','15');e.setAttribute('y2',i%3===0?'26':'21');e.setAttribute('transform',`rotate(${i*30} 120 120)`);e.setAttribute('class','tick');ticks.appendChild(e)}
const colors={blue:['#4e697b','#a6bac8'],purple:['#796044','#cbb494'],green:['#526f5d','#a9bdad']};let darkQuery=matchMedia('(prefers-color-scheme: dark)');function apply(){if(state.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=state.theme;let dark=state.theme==='dark'||(state.theme==='auto'&&darkQuery.matches);document.documentElement.style.setProperty('--clock-color',state.accent==='default'?'var(--fg)':colors[state.accent][dark?1:0]);for(const k of ['seconds','showDigital','showZone'])$(k).checked=state[k];document.querySelectorAll('[data-key]').forEach(el=>el.setAttribute('aria-pressed',String(state[el.dataset.key]===el.dataset.value)));$('second').style.display=state.seconds?'':'none';$('digital').style.display=state.showDigital?'':'none';$('zone').style.display=state.showZone?'':'none';render()}
let cacheKey='',cachedParts=null;const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');function render(){const now=new Date(), tz=state.timezone==='local'?Intl.DateTimeFormat().resolvedOptions().timeZone:state.timezone;const key=tz+':'+Math.floor(now.getTime()/1000);if(key!==cacheKey){cacheKey=key;cachedParts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',timeZoneName:'short'}).formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]))}const parts=cachedParts;const h=+parts.hour,m=+parts.minute,s=+parts.second+(reduceMotion.matches?0:now.getMilliseconds()/1000);for(const [id,angle] of [['hour',(h%12)*30+m*.5],['minute',m*6+s*.1],['second',s*6]])$(id).setAttribute('transform',`rotate(${angle} 120 120)`);$('digital').textContent=`${parts.hour}:${parts.minute}`;$('zone').textContent=parts.timeZoneName||tz;$('digital').setAttribute('aria-label',`${parts.hour}:${parts.minute}`)}
function save(){try{localStorage.setItem('reloj-ajustes-v1',JSON.stringify(state))}catch{}apply()}for(const k of ['seconds','showDigital','showZone'])$(k).addEventListener('change',e=>{state[k]=e.target.checked;save()});document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('click',()=>{state[el.dataset.key]=el.dataset.value;save()}));for(const tab of ['visual','clock'])$('tab-'+tab).addEventListener('click',()=>{for(const x of ['visual','clock']){$('tab-'+x).setAttribute('aria-selected',String(x===tab));$(x==='visual'?'visual':'clock-settings').hidden=x!==tab}});document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=$('tab-visual').getAttribute('aria-selected')==='true'?'clock':'visual';$('tab-'+next).click();$('tab-'+next).focus()}});darkQuery.addEventListener('change',apply);const open=$('open'),panel=$('panel');function setPanel(show){panel.hidden=!show;open.setAttribute('aria-expanded',String(show));if(show)$('tab-visual').focus();else open.focus()}open.addEventListener('click',()=>setPanel(panel.hidden));$('close').addEventListener('click',()=>setPanel(false));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)setPanel(false)});apply();function animate(){render();requestAnimationFrame(animate)}requestAnimationFrame(animate)})();
</script></body></html>
